 # schema.yml

 version: 2

 sources:
   - name: raw
     database: le-wagon-data-analytics-485823
     schema: gz_raw_data
     loader: bigquery
     description: gz sales, product and ship
     freshness:
        warn_after: {count: 12, period: hours}
        error_after: {count: 24, period: hours}
     tables:
       - name: sales
         identifier: raw_gz_sales
       - name: product
         identifier: raw_gz_product
       - name: ship
         identifier: raw_gz_ship