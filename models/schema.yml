version: 2

# ==========================================
# SOURCES
# ==========================================
sources:
  - name: raw
    database: le-wagon-data-analytics-485823
    schema: gz_raw_data
    description: Greenweez raw data loaded into BigQuery
    loader: bigquery

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez — one row per product_id per orders_id
        columns:
          - name: date_date
            description: Date of the purchase
          - name: orders_id
            description: Unique identifier of the order
          - name: pdt_id
            description: Identifier of the product in the order
          - name: revenue
            description: Revenue generated by the product sale
          - name: quantity
            description: Quantity of products purchased
        tests:
          - unique:
              column_name: "concat(orders_id, '-', pdt_id)"
          - not_null:
              column_name: "concat(orders_id, '-', pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: Product catalog of Greenweez
        columns:
          - name: products_id
            description: Unique identifier of the product
            tests:
              - unique
              - not_null
          - name: purchse_price
            description: Purchase price of the product from the supplier

      - name: ship
        identifier: raw_gz_ship
        description: Shipping information for Greenweez orders
        columns:
          - name: orders_id
            description: Unique identifier of the order
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: Shipping fee charged to the customer
          - name: shipping_fee_1
            description: Duplicate of shipping_fee (identical values)
          - name: logCost
            description: Logistic cost associated with the order
          - name: ship_cost
            description: Shipping cost for the order

# ==========================================
# MODELS
# ==========================================
models:
  - name: int_sales_margin
    description: "Calculates the margin for each product in each order by joining sales and product data. This is the foundation for margin analysis."
    columns:
      - name: orders_id
        description: "Unique identifier for each order"
        tests:
          - not_null
      
      - name: date_date
        description: "Date of the transaction"
        tests:
          - not_null
      
      - name: products_id
        description: "Unique identifier for each product"
        tests:
          - not_null
      
      - name: revenue
        description: "Revenue generated from this product sale"
        tests:
          - not_null
      
      - name: quantity
        description: "Quantity of products sold"
        tests:
          - not_null
      
      - name: purchase_price
        description: "Purchase price per unit of the product"
        tests:
          - not_null
      
      - name: purchase_cost
        description: "Total purchase cost calculated as quantity * purchase_price"
        tests:
          - not_null
      
      - name: margin
        description: "Margin calculated as revenue - purchase_cost"
        tests:
          - not_null

  - name: int_orders_margin
    description: "Aggregates product-level margins to order-level. Each row represents one order with its total margin."
    columns:
      - name: orders_id
        description: "Unique identifier for each order (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: date_date
        description: "Date of the order"
        tests:
          - not_null
      
      - name: revenue
        description: "Total revenue for the order"
        tests:
          - not_null
      
      - name: quantity
        description: "Total quantity of products in the order"
        tests:
          - not_null
      
      - name: purchase_cost
        description: "Total purchase cost for the order"
        tests:
          - not_null
      
      - name: margin
        description: "Total margin for the order"
        tests:
          - not_null

  - name: int_orders_operational
    description: "Adds operational costs (shipping and logistics) to calculate the operational margin for each order."
    columns:
      - name: orders_id
        description: "Unique identifier for each order (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: date_date
        description: "Date of the order"
        tests:
          - not_null
      
      - name: revenue
        description: "Total revenue for the order"
        tests:
          - not_null
      
      - name: quantity
        description: "Total quantity of products in the order"
        tests:
          - not_null
      
      - name: purchase_cost
        description: "Total purchase cost for the order"
        tests:
          - not_null
      
      - name: margin
        description: "Total margin for the order (revenue - purchase_cost)"
        tests:
          - not_null
      
      - name: shipping_fee
        description: "Shipping fee paid by the customer"
        tests:
          - not_null
      
      - name: log_cost
        description: "Logistics cost incurred by the company"
        tests:
          - not_null
      
      - name: ship_cost
        description: "Shipping cost incurred by the company"
        tests:
          - not_null
      
      - name: operational_margin
        description: "Operational margin calculated as margin + shipping_fee - log_cost - ship_cost"
        tests:
          - not_null
      
      - name: profit
        description: "Profit for the order (same as operational_margin)"
        tests:
          - not_null

  - name: finance_days
    description: "Daily aggregated metrics for the finance team. Provides a comprehensive view of transactions, revenue, margins, and costs at daily granularity."
    columns:
      - name: date_date
        description: "Date of the aggregated metrics (Primary Key)"
        tests:
          - unique
          - not_null
      
      - name: nb_transactions
        description: "Total number of transactions (orders) for the day"
        tests:
          - not_null
      
      - name: revenue
        description: "Total revenue generated for the day"
        tests:
          - not_null
      
      - name: average_basket
        description: "Average basket size calculated as total revenue / number of transactions"
        tests:
          - not_null
      
      - name: operational_margin
        description: "Total operational margin for the day"
        tests:
          - not_null
      
      - name: purchase_cost
        description: "Total purchase cost for the day"
        tests:
          - not_null
      
      - name: shipping_fee
        description: "Total shipping fees collected from customers for the day"
        tests:
          - not_null
      
      - name: log_cost
        description: "Total logistics costs incurred for the day"
        tests:
          - not_null
      
      - name: quantity
        description: "Total quantity of products sold for the day"
        tests:
          - not_null